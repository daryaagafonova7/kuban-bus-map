<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Поездки на человека в год — Краснодарский край, 2025</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Neucha&family=PT+Mono&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root{
    --emerald:#2fe3a6;
    --emerald-dim:#0b5f49;
    --ink:#cfe8dc;
    --ink-dim:#7fa393;
    --bg:#0a0d0c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;
    font-family:'PT Mono',monospace;}
  #map{position:absolute;inset:0;background:var(--bg);}

  /* ---- атмосферные слои (ШХД: Зима) ---- */
  .grain{position:fixed;inset:-40px;pointer-events:none;z-index:100;opacity:.09;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='280' height='280'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    animation:grain 1.1s steps(4) infinite;}
  @keyframes grain{
    0%{transform:translate(0,0)}25%{transform:translate(-14px,9px)}
    50%{transform:translate(10px,-12px)}75%{transform:translate(-8px,-7px)}
    100%{transform:translate(0,0)}}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:99;
    box-shadow:inset 0 0 220px 70px rgba(0,0,0,.82);}
  .scanlines{position:fixed;inset:0;pointer-events:none;z-index:98;opacity:.10;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.5) 0 1px,transparent 1px 3px);}

  /* ---- шапка ---- */
  header{position:fixed;top:18px;left:20px;z-index:40;pointer-events:none;user-select:none;}
  header h1{margin:0;max-width:760px;font-size:34px;font-weight:700;letter-spacing:.5px;
    line-height:1.3;color:#f2fbf6;
    text-shadow:0 2px 12px rgba(0,0,0,.95);}
  header .hint{margin-top:9px;font-size:11px;color:var(--ink-dim);opacity:.75;letter-spacing:1px;}

  /* ---- панель справа сверху ---- */
  .topright{position:fixed;top:18px;right:20px;z-index:40;text-align:right;}
  .stats{font-size:11px;color:var(--ink-dim);letter-spacing:1px;margin-bottom:8px;}
  .stats b{color:var(--ink);font-weight:400;}
  #reset{font-family:'PT Mono',monospace;font-size:11px;letter-spacing:1px;cursor:pointer;
    color:var(--emerald);background:rgba(8,14,12,.85);border:1px solid rgba(47,227,166,.35);
    padding:6px 12px;transition:background .15s;}
  #reset:hover{background:rgba(14,34,27,.9);}

  /* ---- легенда ---- */
  .legend{position:fixed;left:20px;bottom:18px;z-index:40;max-width:330px;
    background:rgba(6,10,9,.85);border:1px solid rgba(47,227,166,.18);
    padding:14px 16px 12px;color:#9fb8ac;font-size:11px;line-height:1.5;
    backdrop-filter:blur(2px);}
  .legend .lt{color:var(--ink);letter-spacing:2px;font-size:10px;margin:10px 0 6px;}
  .legend .lt:first-child{margin-top:0;}
  .sizes{display:flex;align-items:flex-end;gap:14px;}
  .sizes .sz{display:flex;flex-direction:column;align-items:center;gap:3px;color:#748c81;font-size:10px;}
  .glowbar{height:10px;border:1px solid rgba(47,227,166,.3);
    background:linear-gradient(90deg,rgba(11,95,73,.12),#0b5f49 30%,#2fe3a6 75%,#b9ffe3);}
  .glowlbl{display:flex;justify-content:space-between;margin-top:3px;font-size:10px;color:#748c81;}
  .nodata-row{display:flex;align-items:center;gap:8px;margin-top:9px;color:#748c81;font-size:10px;}
  .foot{margin-top:9px;font-size:10px;color:#5c7168;font-style:normal;}
  .foot .neu{font-family:'Neucha',cursive;color:#6fae94;font-size:13px;}

  /* ---- маркеры-рули ---- */
  .wheel{position:absolute;cursor:pointer;transform-origin:center;}
  .wheel svg{display:block;width:100%;height:100%;transition:transform .18s ease;overflow:visible;}
  .wheel:hover svg{transform:scale(1.14);}
  .wheel .lbl{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:5px;
    white-space:nowrap;font:11px 'PT Mono',monospace;color:#d7efe4;letter-spacing:.5px;
    background:rgba(8,12,11,.9);border:1px solid rgba(47,227,166,.3);
    padding:4px 9px;opacity:0;transition:opacity .15s;pointer-events:none;z-index:5;}
  .wheel .lbl .v{color:var(--emerald);}
  .wheel:hover .lbl{opacity:1;}
  .wheel.nodata{opacity:.62;filter:saturate(.15) brightness(1.05);}
  .wheel.nodata:hover{opacity:.9;}
  @keyframes pulseGlow{0%,100%{opacity:.55}50%{opacity:1}}
  .g-pulse{animation:pulseGlow 2.8s ease-in-out infinite;}

  /* ---- попап: советская остановка ---- */
  .maplibregl-popup{z-index:60;}
  .maplibregl-popup-content{padding:0;background:transparent;box-shadow:none;border-radius:0;}
  .maplibregl-popup-tip{display:none;}
  .stop{width:308px;position:relative;font-family:'PT Mono',monospace;filter:drop-shadow(0 18px 30px rgba(0,0,0,.65));}
  .stop .roof{height:24px;border-top:5px solid #31383b;border-bottom:3px solid #14181a;
    background:repeating-linear-gradient(90deg,#262c2f 0 9px,#1a1f21 9px 18px);
    margin:0 -12px;transform:translateY(7px);z-index:2;position:relative;
    box-shadow:0 8px 14px rgba(0,0,0,.5);}
  .stop .panel{background:linear-gradient(#242a2c,#171c1e);border:2px solid #30383b;
    border-top:none;padding:24px 14px 12px;position:relative;}
  .stop .panel::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(90deg,transparent 0 26px,rgba(0,0,0,.22) 26px 28px);}
  .stop .legs{display:flex;justify-content:space-between;padding:0 26px;}
  .stop .legs i{display:block;width:9px;height:16px;background:linear-gradient(#22282a,#0f1315);}
  .poster{position:relative;background:linear-gradient(160deg,#e9e2cb,#d9d0b4 60%,#cfc5a6);
    color:#2b2720;font-family:'Neucha',cursive;padding:9px 13px 11px;margin:10px 4px;
    box-shadow:2px 5px 9px rgba(0,0,0,.5);border-radius:2px;}
  .poster::before{content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(-2.5deg);
    width:74px;height:17px;background:rgba(235,240,235,.16);border-left:1px solid rgba(255,255,255,.1);
    border-right:1px solid rgba(255,255,255,.1);}
  .poster.pl1{transform:rotate(-1.8deg);}
  .poster.pl2{transform:rotate(1.4deg);}
  .poster .pp-h{font-size:14px;letter-spacing:3px;text-transform:uppercase;color:#8a4a2f;opacity:.85;}
  .poster .pp-name{font-size:27px;line-height:1.05;margin:2px 0 1px;}
  .poster .pp-sub{font-size:14px;color:#6d6353;}
  .poster .row{display:flex;justify-content:space-between;gap:10px;font-size:16px;line-height:1.5;}
  .poster .row .k{color:#544c3e;}
  .poster .row .v{color:#0e6a4f;white-space:nowrap;}
  .poster .row.hl{font-size:19px;}
  .poster .row.hl .v{border-bottom:2px solid rgba(14,106,79,.6);}
  .poster .none{color:#a3543a;}
  .graffiti{font-family:'Neucha',cursive;font-size:13px;color:rgba(233,226,203,.55);
    transform:rotate(-2.4deg);text-align:right;padding:2px 10px 4px;}
  .cls{position:absolute;top:10px;right:10px;z-index:5;width:24px;height:24px;cursor:pointer;
    color:#9fb8ac;background:rgba(10,14,13,.9);border:1px solid rgba(47,227,166,.3);
    font:13px 'PT Mono',monospace;line-height:1;padding:0;}
  .cls:hover{color:var(--emerald);}

  /* ---- атрибуция ---- */
  .maplibregl-ctrl-attrib{background:rgba(6,10,9,.8)!important;color:#5c7168!important;
    font:10px 'PT Mono',monospace;}
  .maplibregl-ctrl-attrib a{color:#748c81!important;}

  @media (max-width:640px){
    header h1{font-size:14px}
    .legend{max-width:250px;font-size:10px;padding:10px}
    .topright{top:auto;bottom:200px}
  }
</style>
</head>

const ALL_NP = DATA.length;
DATA = DATA.filter(d => d.trips != null); // на карте — только НП с данными о поездках

/* ---------- шкалы ---------- */
const POP_MIN = Math.min(...DATA.map(d=>d.pop||Infinity));
const POP_MAX = Math.max(...DATA.map(d=>d.pop||0));
const MAXTRIPS = Math.max(...DATA.map(d=>d.trips||0));

function sizeFor(pop){ // диаметр, px
  if(!pop) return 16;
  return 17 + 58*Math.sqrt(pop/POP_MAX);
}
function fillFor(trips){
  return trips==null ? 0 : Math.min(1, trips/MAXTRIPS);
}

/* ---------- руль: объёмное ретро-стекло ---------- */
function wheelSVG(fill, hasData, i, opts){
  opts = opts||{};
  const uid = 'w'+i+'_'+Math.random().toString(36).slice(2,7);
  const C=60, RO=47, T=8, RI=RO-T/2;          // центр, радиусы обода
  const liqR = RI-1;
  const em = hasData;
  const c = (a)=>`rgba(${em?'47,227,166':'120,135,130'},${a})`;
  const lvl = C + liqR - fill*liqR*2;          // верх «жидкости»
  return `
  <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="${uid}r" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="${em?'#1c5a48':'#262d2f'}"/>
        <stop offset=".45" stop-color="${em?'#0b2019':'#12181a'}"/>
        <stop offset="1" stop-color="${em?'#173f34':'#22292c'}"/>
      </linearGradient>
      <radialGradient id="${uid}g" cx=".5" cy=".62" r=".62">
        <stop offset="0" stop-color="rgba(124,255,196,.55)"/>
        <stop offset=".55" stop-color="rgba(35,190,140,.28)"/>
        <stop offset="1" stop-color="rgba(10,60,45,0)"/>
      </radialGradient>
      <linearGradient id="${uid}l" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8dffd2"/>
        <stop offset=".22" stop-color="#2fe3a6"/>
        <stop offset="1" stop-color="#0a6b52"/>
      </linearGradient>
      <clipPath id="${uid}c"><circle cx="${C}" cy="${C}" r="${liqR}"/></clipPath>
    </defs>

    <!-- внутреннее свечение -->
    ${em?`<circle cx="${C}" cy="${C}" r="${liqR}" fill="url(#${uid}g)"
        opacity="${(.18+.8*fill).toFixed(2)}" class="g-pulse"/>`:''}

    <!-- «жидкость» — заполняется свечением -->
    ${em && fill>0.02 ? `
    <g clip-path="url(#${uid}c)">
      <rect x="${C-liqR}" y="${lvl}" width="${liqR*2}" height="${C+liqR-lvl}" fill="url(#${uid}l)" opacity=".9"/>
      <ellipse cx="${C}" cy="${lvl}" rx="${liqR}" ry="2.6" fill="#b9ffe3" opacity=".95"/>
      <ellipse cx="${C}" cy="${lvl}" rx="${liqR*.7}" ry="6" fill="#b9ffe3" opacity=".25"/>
    </g>`:''}

    <!-- три спицы: влево, вправо, вниз -->
    <g fill="${em?'url(#'+uid+'r)':'#1c2224'}" stroke="${c(.5)}" stroke-width="1">
      <rect x="17" y="${C-3.2}" width="36" height="6.4" rx="3.2"/>
      <rect x="${C+7}" y="${C-3.2}" width="36" height="6.4" rx="3.2"/>
      <rect x="${C-3.2}" y="${C+7}" width="6.4" height="26" rx="3.2"/>
    </g>

    <!-- обод: объёмное стекло -->
    <circle cx="${C}" cy="${C}" r="${RO}" fill="none" stroke="url(#${uid}r)" stroke-width="${T}"/>
    <circle cx="${C}" cy="${C}" r="${RO+T/2-.5}" fill="none" stroke="rgba(0,0,0,.6)" stroke-width="1"/>
    <circle cx="${C}" cy="${C}" r="${RI}" fill="none" stroke="${c(em?(.2+.75*fill):.25)}" stroke-width="${em?(.8+1.6*fill).toFixed(2):1}"/>

    <!-- блики на стекле -->
    <path d="M 15.8 43.9 A ${RO} ${RO} 0 0 1 68.2 13.7" fill="none"
      stroke="rgba(215,255,238,.4)" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 104.2 76.1 A ${RO} ${RO} 0 0 1 83.5 100.7" fill="none"
      stroke="rgba(0,0,0,.45)" stroke-width="3.4" stroke-linecap="round"/>

    <!-- ступица + кнопка гудка -->
    <circle cx="${C}" cy="${C}" r="9" fill="${em?'url(#'+uid+'r)':'#1c2224'}" stroke="${c(.6)}" stroke-width="1.4"/>
    <circle cx="${C}" cy="${C}" r="3.2" fill="${em?'#2fe3a6':'#3a4240'}" opacity="${em?(.35+.65*fill).toFixed(2):1}"/>
  </svg>`;
}

/* ---------- форматирование ---------- */
const fmtInt = x => x==null ? null : Math.round(x).toLocaleString('ru-RU');
const fmt1   = x => x==null ? null : x.toLocaleString('ru-RU',{minimumFractionDigits:1,maximumFractionDigits:1});

const map = new maplibregl.Map({

/* ---------- попап-остановка ---------- */
const popup = new maplibregl.Popup({closeButton:false,closeOnClick:true,maxWidth:'320px'});

function stopHTML(d){
  const tripLine = d.trips!=null
    ? `<div class="row hl"><span class="k">поездок на человека в год:</span><span class="v">${fmt1(d.trips)}</span></div>`
    : `<div class="row"><span class="k">поездок на человека в год:</span><span class="v none">данных нет</span></div>`;
  const popLine  = d.pop  != null ? `<div class="row"><span class="k">население:</span><span class="v">${fmtInt(d.pop)} чел.</span></div>` : '';
  const busLine  = d.buses!= null ? `<div class="row"><span class="k">автобусов:</span><span class="v">${fmtInt(d.buses)}</span></div>` : '';
  const passLine = d.pass != null ? `<div class="row"><span class="k">перевезено за год:</span><span class="v">${fmt1(d.pass)} тыс. чел.</span></div>` : '';
  return `
  <div class="stop">
    <button class="cls" title="закрыть">✕</button>
    <div class="roof"></div>
    <div class="panel">
      <div class="poster pl1">
        <div class="pp-h">остановка</div>
        <div class="pp-name">${d.name}</div>
        <div class="pp-sub">${d.type||'населённый пункт'}, Краснодарский край</div>
      </div>
      <div class="poster pl2">
        ${tripLine}
        ${popLine}${busLine}${passLine}
      </div>
      <div class="graffiti">по данным росстата · 2025</div>
    </div>
    <div class="legs"><i></i><i></i></div>
  </div>`;
}

function openStop(d, el){
  popup.setLngLat([d.lon,d.lat])
       .setDOMContent(htmlToDom(stopHTML(d)))
       .addTo(map);
  popup._container.querySelector('.cls').onclick=()=>popup.remove();
  // приподнять карту, чтобы остановка не уехала за экран
  const off = sizeFor(d.pop)/2 + 40;
  map.panTo([d.lon,d.lat],{offset:[0,-(off-60)],duration:450});
}
function htmlToDom(html){
  const t=document.createElement('div'); t.innerHTML=html.trim(); return t.firstElementChild;
}

/* ---------- маркеры ---------- */
DATA.forEach((d,i)=>{
  const hasData = d.trips!=null;
  const size = sizeFor(d.pop);
  const el = document.createElement('div');
  el.className = 'wheel'+(hasData?'':' nodata');
  el.style.width = el.style.height = size+'px';
  el.style.filter = hasData
    ? `drop-shadow(0 0 ${(5+16*fillFor(d.trips)).toFixed(0)}px rgba(47,227,166,${(.22+.5*fillFor(d.trips)).toFixed(2)}))`
    : 'drop-shadow(0 2px 6px rgba(0,0,0,.6))';
  el.innerHTML = wheelSVG(fillFor(d.trips), hasData, i)
    + `<div class="lbl">${d.name}${hasData?` · <span class="v">${fmt1(d.trips)}</span>`:''}</div>`;
  el.addEventListener('click', e=>{e.stopPropagation(); openStop(d, el);});
  new maplibregl.Marker({element:el, anchor:'center'})
    .setLngLat([d.lon,d.lat])
    .addTo(map);
});

/* ---------- легенда и статистика ---------- */
const withData = DATA.length;
document.getElementById('stats').innerHTML =
  `НП С ДАННЫМИ: <b>${withData}</b> ИЗ ${ALL_NP} В КРАЕ`;
document.getElementById('legMax').textContent = fmt1(MAXTRIPS);
document.getElementById('legFoot').innerHTML =
  `* Борисовка — в данных Росстата опечатка (773,7), запятая сдвинута: исправлено на <span class="neu">77,4 поездки/чел.</span>`;

const legSizes=document.getElementById('legSizes');
[[1000,'1 тыс.'],[30000,'30 тыс.'],[918145,'918 тыс.']].forEach(([p,lbl],j)=>{
  const s=sizeFor(p);
  const w=document.createElement('div'); w.className='sz';
  w.innerHTML=`<div style="width:${s}px;height:${s}px">${wheelSVG(.45,true,'leg'+j)}</div><span>${lbl}</span>`;
  legSizes.appendChild(w);
});
</script>
</body>
</html>
